<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Ashby Application</title></head>
<body data-ats="ashby" data-application-state="application_form">
  <form class="ashby-application-form" data-testid="application-form" id="ashby_form">
    <label for="candidate-first">First Name</label>
    <input id="candidate-first" name="firstName" autocomplete="given-name" required>

    <label for="candidate-last">Last Name</label>
    <input id="candidate-last" name="lastName" autocomplete="family-name" required>

    <label for="candidate-email">Email</label>
    <input id="candidate-email" name="email" type="email" autocomplete="email" required>

    <label for="candidate-phone">Phone Number</label>
    <input id="candidate-phone" name="phoneNumber" type="tel" autocomplete="tel">

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
