<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Validation Error</title></head>
<body data-application-state="application_form">
  <form id="val-form">
    <div class="field-error" role="alert">Email is required</div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required class="error">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" required value="Ada">
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
