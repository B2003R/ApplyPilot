<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Workday Career — Contact</title></head>
<body data-ats="workday" data-application-state="application_form">
  <div data-automation-id="jobPostingPage">
    <h2>Contact Information</h2>
    <div data-automation-id="formField">
      <label for="wd-first">First Name</label>
      <input id="wd-first" name="legalNameSection_firstName" autocomplete="given-name"
             data-automation-id="legalNameSection_firstName" required>
    </div>
    <div data-automation-id="formField">
      <label for="wd-last">Last Name</label>
      <input id="wd-last" name="legalNameSection_lastName" autocomplete="family-name"
             data-automation-id="legalNameSection_lastName" required>
    </div>
    <div data-automation-id="formField">
      <label for="wd-email">Email</label>
      <input id="wd-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div data-automation-id="formField">
      <label for="wd-phone">Phone Device Type</label>
      <input id="wd-phone" name="phone" type="tel" autocomplete="tel">
    </div>
    <button data-automation-id="bottom-navigation-next-button" type="button">Next</button>
  </div>
</body>
</html>
